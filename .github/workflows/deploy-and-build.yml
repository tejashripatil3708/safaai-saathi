name: Safai Saathi CI, Release Build & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'build-and-deploy'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm --prefix apps/citizen_app install

      - name: Build Production Web App / PWA
        run: |
          npm --prefix apps/citizen_app run build

      - name: Upload Web & PWA Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safai-saathi-pwa-bundle
          path: apps/citizen_app/dist/

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/citizen_app/dist
          branch: gh-pages
          clean: true

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Assets
        run: |
          npm --prefix apps/citizen_app install
          npm --prefix apps/citizen_app run build

      - name: Sync Capacitor Android
        run: |
          cd apps/citizen_app
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x apps/citizen_app/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd apps/citizen_app/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safai-saathi-android-apk
          path: apps/citizen_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
