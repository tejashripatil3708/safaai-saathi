name: Safaai Saathi CI, Web & Android APK Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'build-and-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm --prefix apps/citizen_app install

      - name: Build Web App
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDemo-Godhra-SafaaiSaathi2026' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'safai-saathi-panchmahal.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'safai-saathi-panchmahal' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'safai-saathi-panchmahal.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '1029384756' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:1029384756:web:a1b2c3d4e5f6' }}
        run: |
          npm --prefix apps/citizen_app run build

      - name: Sync Capacitor Android
        run: |
          cd apps/citizen_app
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x apps/citizen_app/android/gradlew

      - name: Build Android APK (Safaai-Saathi.apk)
        run: |
          cd apps/citizen_app/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to Web Dist for 1-Click Direct Download
        run: |
          cp apps/citizen_app/android/app/build/outputs/apk/debug/Safaai-Saathi.apk apps/citizen_app/dist/Safaai-Saathi.apk

      - name: Deploy to GitHub Pages (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/citizen_app/dist
          branch: gh-pages
          clean: true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safaai-saathi-android-apk
          path: apps/citizen_app/android/app/build/outputs/apk/debug/Safaai-Saathi.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Safaai Saathi Android v1.0.0"
          body: "Official Android APK build for Safaai Saathi Citizen Sanitation Monitoring System (Panchmahal Godhra). Direct installable .apk."
          files: apps/citizen_app/android/app/build/outputs/apk/debug/Safaai-Saathi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
